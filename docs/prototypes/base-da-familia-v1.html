<title>EOS Base da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,500&display=swap">
<style>
/* Layout: "em execução" phone shell — status strip on top, centered hero numeral + mint bearing label, glowing route panel, outlined tiles, fixed bottom tab bar. Committed single dark theme (from EOS execution concepts). */
:root{
  color-scheme:dark;
  --bg:#0A0E16; --bg2:#0E1320; --surface:#131A28; --surface2:#182133; --line:#27324A; --line2:#34405C;
  --ink:#F1F4F8; --muted:#A3ADBF; --dim:#8E99B0;
  --mint:#3FE0B0; --mint2:#25C795; --mint-ink:#04221A; --amber:#F2B33D; --red:#F06B60;
  --cond:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --sans:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:16px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,#16233A 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint)}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.label{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.label.mint{color:var(--mint)}
.label.amber{color:var(--amber)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;background:var(--mint);color:var(--mint-ink);font-weight:600;padding:10px 16px;border-radius:10px;transform:translateY(-200%)}
.skip:focus{transform:none}
#view:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond)}

/* status strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(10,14,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:14px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.on{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.dot.warn{background:var(--amber);box-shadow:0 0 10px rgba(242,179,61,.6)}
.strip .mid{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.strip .right{justify-self:end;font-family:var(--cond);font-weight:600;font-size:19px;color:var(--ink)}
.save{font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;text-align:center;margin-top:2px}

main{padding-block:30px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:30px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* hero numeral */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.big{font-family:var(--cond);font-weight:600;font-size:clamp(108px,32vw,150px);line-height:.86;letter-spacing:-.01em}
.big small{font-size:.3em;font-weight:500;letter-spacing:.02em;margin-left:4px;color:var(--muted)}
.bearing{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.hero p{max-width:34ch;color:var(--muted);font-size:16px;margin-top:6px}

/* panels */
.panel{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:22px 20px}

/* route map */
.map{position:relative;height:250px;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:#0C111C}
.map::before{content:"";position:absolute;left:-40%;right:-40%;top:18%;bottom:-60%;background-image:linear-gradient(rgba(120,140,180,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,180,.13) 1px,transparent 1px);background-size:44px 44px;transform:perspective(320px) rotateX(52deg);transform-origin:50% 0}
.map::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0C111C 0%,transparent 30%,transparent 80%,rgba(12,17,28,.7) 100%);pointer-events:none}
.map svg.chart{position:absolute;inset:48px 56px 22px 18px;width:calc(100% - 74px);height:calc(100% - 70px);overflow:visible;z-index:1}
.map .lvl{position:absolute;right:10px;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--dim);transform:translateY(-50%);z-index:2}
.map .lvl.tgt{color:var(--mint)}
.map .pin{position:absolute;z-index:3;transform:translate(-50%,-100%);width:26px;height:34px}
.map .start{position:absolute;z-index:3;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.tag{position:absolute;left:14px;top:12px;z-index:3;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);background:rgba(12,17,28,.85);padding:5px 12px;border-radius:999px}

/* carousel */
.cchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;overscroll-behavior-x:contain;transition:height .25s ease-out}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column}
.slide > .map{height:300px}
.dots{display:flex;justify-content:center;gap:4px}
.dots button{width:44px;height:44px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:10px;height:10px;border-radius:5px;background:var(--line2);transition:width .2s,background .2s}
.dots button[aria-current="true"]::before{background:var(--mint);box-shadow:0 0 8px var(--mint);width:26px}

/* systems */
.sys{padding:18px 16px 16px;display:flex;flex-direction:column;gap:6px;height:100%}
.sys-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 2px 10px;border-bottom:1px solid var(--line)}
.sys-count{font-family:var(--cond);font-weight:600;font-size:34px;line-height:1;margin-top:4px}
.sys-count small{font-size:.5em;font-weight:500;color:var(--muted);margin-left:4px}
.tag2{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:5px 12px;border-radius:999px;white-space:nowrap}
.srow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;color:var(--ink)}
.srow:last-of-type{border-bottom:0}
.srow:hover{background:rgba(255,255,255,.02)}
.srow.real{cursor:help}
.sicon{position:relative;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--dim);grid-row:span 2}
.sicon svg{width:22px;height:22px}
.sicon.on{color:var(--mint);border-color:rgba(63,224,176,.5);background:rgba(63,224,176,.07)}
.sicon.off{color:var(--red);border-color:rgba(240,107,96,.55);background:rgba(240,107,96,.06)}
.sicon.sb{color:var(--amber);border-color:rgba(242,179,61,.5)}
.led{position:absolute;top:-1px;right:-1px;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface);background:var(--dim)}
.led.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.led.off{background:var(--red)}
.led.sb{background:var(--amber)}
.sname{font-weight:600;font-size:17px;line-height:1.25;min-width:0}
.sname small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.sst{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sst.on{color:var(--mint)}.sst.off{color:var(--red)}.sst.sb{color:var(--amber)}
.tl{grid-column:2 / -1;position:relative;height:10px;border-radius:5px;background:#0C111C;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.tl i{position:absolute;top:0;bottom:0}
.tl i.on{background:var(--mint);box-shadow:0 0 8px rgba(63,224,176,.6)}
.tl i.off{background:repeating-linear-gradient(135deg,var(--red) 0 4px,rgba(240,107,96,.35) 4px 8px)}
.tl i.sb{background:repeating-linear-gradient(90deg,rgba(242,179,61,.75) 0 6px,transparent 6px 10px)}
.axis{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;padding:2px 2px 0}
.axis div{display:flex;justify-content:space-between;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.sys-note{font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.sys-note b{color:var(--muted);font-weight:600}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 14px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--cond);font-weight:600;font-size:40px;line-height:1}
.tile b small{font-size:.55em;font-weight:500;margin-left:3px}
.tile .label{font-size:14px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.tile.hl{border-color:rgba(63,224,176,.45)}
.tile.hl::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:3px;border-radius:2px;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.tile.hl .label{color:var(--mint)}

/* step pills */
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pill{border:1px solid var(--line2);background:var(--surface);border-radius:999px;min-height:48px;padding:6px 8px;font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill .ck{color:var(--mint)}
.pill.cur{border-color:var(--mint);background:rgba(63,224,176,.13);color:var(--ink)}
.pill.cur::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}
.pill[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--mint-ink);box-shadow:0 0 18px rgba(63,224,176,.35)}
.pill[aria-pressed="true"] .ck{color:var(--mint-ink)}
.pill[aria-pressed="true"]::before{background:var(--mint-ink)}
.pill small{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:0;opacity:.85}

/* step card */
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:center}
.ring{width:56px;height:56px;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;font-family:var(--cond);font-weight:600;font-size:28px;box-shadow:0 0 14px rgba(63,224,176,.22),inset 0 0 10px rgba(63,224,176,.12)}
.step h2{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.01em}
.step p{color:var(--muted);font-size:15px;margin-top:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px 20px;min-height:54px;font-family:var(--sans);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,#5CEFC2,var(--mint2));border-color:transparent;color:var(--mint-ink);box-shadow:0 0 22px rgba(63,224,176,.28)}
.btn.primary:hover{filter:brightness(1.05)}
button,a,.btn,.pill,.choice,.srow,.from,.fchip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.pill:active,.choice:active,.srow:active,.from:active,.fchip:active,.stepper button:active{transform:scale(.97)}
.btn,.pill,.choice,.srow,.from,.fchip,.stepper button{transition:transform .12s ease-out,background-color .15s,border-color .15s}
.btn.danger{color:var(--red);border-color:rgba(240,107,96,.6);background:rgba(240,107,96,.06)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.btn.block{width:100%}
.btn.pillish{border-radius:999px}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--mint);cursor:pointer;font-weight:600;font-size:16px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* choice cards (signals) */
.choice{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--line2);background:var(--surface2)}
.choice h3{font-size:19px;font-weight:600;line-height:1.3}
.choice .sub{font-size:14px;color:var(--dim);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chev{color:var(--mint);width:26px;height:26px}
.lv{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid}
.lv.preparar{color:var(--mint);border-color:rgba(63,224,176,.5)}
.lv.monitorar{color:var(--muted);border-color:var(--line2)}
.lv.contexto{color:var(--amber);border-color:rgba(242,179,61,.5)}
.lv.agir{color:var(--red);border-color:rgba(240,107,96,.55)}

/* quote + official */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 20px 22px;position:relative}
.quote::before{content:"";position:absolute;left:12px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--amber)}
.quote .label{padding-left:8px;padding-bottom:10px;border-bottom:1px solid var(--line);display:inline-block}
.quote blockquote{margin:14px 0 0;padding-left:8px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(21px,5.4vw,25px);line-height:1.35}
.quote .by{padding-left:8px;margin-top:12px;font-size:14px;color:var(--dim)}
.official{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.official svg{width:28px;height:30px;color:var(--muted)}
.official b{font-weight:600}
.official .src{font-size:14px;color:var(--dim);margin-top:6px;display:flex;flex-direction:column;gap:4px}
.official .src a{color:var(--muted);display:inline-flex;align-items:center;min-height:44px}

/* requirements */
.mod-h{display:flex;align-items:center;gap:12px;margin:8px 0 2px}
.mod-h::after{content:"";flex:1;height:1px;background:var(--line)}
.req{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.st{width:44px;height:44px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:var(--dim)}
.st svg{width:20px;height:20px}
.st.done{border-color:var(--mint);background:rgba(63,224,176,.14);color:var(--mint);box-shadow:0 0 12px rgba(63,224,176,.25)}
.st.half{border-color:var(--amber);color:var(--amber)}
.req h3{margin:0;font-size:18px;font-weight:600;line-height:1.3;padding-top:10px}
.req .h{font-size:15px;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:#0C111C;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:12px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.bar i.inh{background:rgba(63,224,176,.38);box-shadow:none}
.srcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.from{border:1px solid var(--line2);background:var(--bg2);border-radius:12px;padding:10px 14px;min-height:44px;max-width:100%;line-height:1.35;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.from em{font-style:normal;color:var(--mint)}
.req .act{margin-top:12px}

/* split meter */
.split{height:14px;display:flex;border-radius:7px;overflow:hidden;background:#0C111C;border:1px solid var(--line)}
.split i{display:block;height:100%}
.split .a{background:rgba(63,224,176,.38)}.split .b{background:var(--mint);box-shadow:0 0 12px var(--mint)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}

/* inventory */
.search{width:100%;padding:14px 16px;min-height:54px;font-size:17px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted)}
.fchip[aria-pressed="true"]{background:rgba(63,224,176,.13);border-color:var(--mint);color:var(--ink)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.item .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.item h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.item .q{font-family:var(--cond);font-weight:600;font-size:24px;line-height:1;white-space:nowrap}
.item .q small{font-size:.62em;font-weight:500;color:var(--muted);margin-left:3px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;color:var(--muted)}
.meta span{display:inline-flex;gap:6px;align-items:center}
.meta svg{width:15px;height:15px;color:var(--dim)}
.why{border-left:3px solid var(--amber);padding:2px 0 2px 14px}
.why .label{font-size:14px;margin-bottom:4px}
.why p{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4}
.why p.none{font-family:var(--sans);font-style:normal;font-size:15px;color:var(--dim)}
.flag{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid}
.flag.crit{color:var(--red);border-color:rgba(240,107,96,.55)}
.flag.warn{color:var(--amber);border-color:rgba(242,179,61,.5)}
.group-h{margin:0;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-top:10px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* family */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ftile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;min-width:0}
.ftile .label{font-size:14px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;width:100%}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);font-size:24px;line-height:1;cursor:pointer;color:var(--ink)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--cond);font-weight:600;font-size:40px;width:100%;min-width:0;padding:0}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:15px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;font-size:17px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);min-height:54px}
.field textarea{min-height:100px;resize:vertical}
.full{grid-column:1/-1}

.banner{border:1px solid rgba(242,179,61,.45);background:rgba(242,179,61,.06);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:16px}
.banner b{color:var(--amber)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(10,14,22,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);padding-block:8px 6px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--dim);font-size:14px;font-weight:600;padding:6px 0;min-height:56px}
.tabbar svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--mint)}
.tabbar a[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(63,224,176,.6))}

.tip{position:fixed;z-index:40;max-width:min(290px,calc(100vw - 24px));background:#1C2740;border:1px solid rgba(63,224,176,.55);color:var(--ink);font-size:15px;line-height:1.45;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 16px rgba(63,224,176,.15);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);margin-bottom:4px}
.tip::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:#1C2740;border:1px solid rgba(63,224,176,.55);transform:translateX(-50%) rotate(45deg)}
.tip.up::after{bottom:-6px;border-top:0;border-left:0}
.tip.down::after{top:-6px;border-bottom:0;border-right:0}
[data-tip]:not(button):not(a):not(input){cursor:help}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,5,10,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}

.sheet .fgrid{gap:18px}

@media (max-width:520px){

  .actions{grid-template-columns:1fr}
  .pill{font-size:15px;letter-spacing:.03em}
  .map svg.chart{right:48px;width:calc(100% - 66px)}

@media (prefers-reduced-motion:no-preference){

  .bar i,.split i{transition:width .5s ease}
  .map svg.chart{animation:reveal 1.2s ease-out both}

}

function F(){return S.state.family}
function people(){return Math.max(0,+F().adults||0)+Math.max(0,+F().kids||0)}

 if(k==="comida")return 3*people();
 if(k==="remedios")return (+f.meds||0)>0?1:0;return 0}
function itemsFor(k){return S.state.items.filter(function(i){return i.req===k})}
function haveIn(list,k){return list.filter(function(i){return i.req===k}).reduce(function(s,i){return s+(+i.qty||0)},0)}
function have(k,proto){return itemsFor(k).filter(function(i){return !proto||i.proto===proto}).reduce(function(s,i){return s+(+i.qty||0)},0)}
function daysOf(k,list){var p=perDay(k);return p?haveIn(list||S.state.items,k)/p:null}
function limits(list){var a=[["agua",daysOf("agua",list)],["comida",daysOf("comida",list)]];if((+F().meds||0)>0)a.push(["remedios",daysOf("remedios",list)]);

function autonomy(list){var l=limits(list);return l.length?Math.min.apply(null,l.map(function(x){return x[1]})):0}
function reqsFor(pid,deg){return REQS.filter(function(r){
 if(r.only&&r.only.indexOf(pid)<0)return false;
 if(r.t==="q")return !(r.meds&&!((+F().meds||0)>0))&&perDay(r.k)>0;
 return r.min<=deg})}
function scoreReq(r,deg,pid){
 if(r.t==="q"){var need=perDay(r.k)*deg,h=have(r.k),s=need?Math.min(1,h/need):0,other=h?(h-have(r.k,pid))/h:0;return {s:s,inh:s*other,need:need,have:h}}
 var its=itemsFor(r.k),s2=its.length?1:0,mine=its.some(function(i){return i.proto===pid});
 return {s:s2,inh:s2&&!mine?1:0}}
function scoreDeg(pid,deg){var rs=reqsFor(pid,deg),t=0,inh=0;rs.forEach(function(r){var x=scoreReq(r,deg,pid);t+=x.s;inh+=x.inh});
 return {pct:rs.length?t/rs.length:0,inh:rs.length?inh/rs.length:0}}
function rpos(d){var st=[[0,0],[3,14],[14,40],[30,64],[90,100]];if(d>=90)return 100;
 for(var i=1;i<st.length;i++){if(d<=st[i][0]){var a=st[i-1],b=st[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0])}}return 100}
